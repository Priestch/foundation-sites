<!DOCTYPE html>
<html>
  <head>
    <title>Mocha</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../node_modules/jquery/dist/jquery.js"></script>
    <script src="../../_build/assets/js/foundation.js"></script>
    <script src="../../_build/assets/js/foundation-next.js"></script>
    <script src="../../node_modules/mocha/mocha.js"></script>
    <link rel="stylesheet" href="../../node_modules/mocha/mocha.css" />
    <link rel="stylesheet" href="../../_build/assets/css/foundation-float.css">
  </head>
  <body>
    <div id="mocha"></div>
    <script src="../../node_modules/chai/chai.js"></script>
    <script src="../../node_modules/chai-jquery/chai-jquery.js"></script>
    <script src="../../node_modules/sinon/pkg/sinon-no-sourcemaps.js"></script>
    <script>
      mocha.setup({
        ui: 'bdd',
        timeout: 5000,
      });
      chai.should();
      // ?grep=<regex> narrows the run for fast iteration (S16: the Playwright
      // runner passes the query string through in its page argument; full
      // runs omit it).
      var urlGrep = new URLSearchParams(location.search).get('grep');
      if (urlGrep) { mocha.grep(new RegExp(urlGrep)); }
    </script>
    <script src="lib/keyboard-event-mock.js"></script>
    <script src="lib/utils.js"></script>
    <script src="js-tests.js"></script>
    <script>
      // Report the run to the external test runner (Playwright, S15).
      var runner = mocha.run();
      var failures = [];
      runner.on('fail', function (test, err) {
        failures.push({
          title: test.fullTitle(),
          message: err && err.message,
          stack: err && err.stack
        });
      });
      runner.on('end', function () {
        window.__mochaDone = true;
        window.__mochaStats = runner.stats;
        window.__mochaFailures = failures;
      });
    </script>
  </body>
</html>
