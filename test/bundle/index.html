<!DOCTYPE html>
<html>

  <head>
    <title>Mocha Test</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../node_modules/mocha/mocha.css" />
    <link rel="stylesheet" href="../../_build/assets/css/foundation.css">
    <link rel="stylesheet" href="../../node_modules/motion-ui/dist/motion-ui.css">
  </head>

  <body>

    <div id="mocha"></div>

    <script src="../../node_modules/chai/chai.js"></script>
    <script src="../../node_modules/mocha/mocha.js"></script>
    <script src="../../node_modules/requirejs/require.js"></script>
    <script src="../../node_modules/jquery/dist/jquery.js"></script>
    <script>
      mocha.setup({
        ui: 'bdd',
        timeout: 5000,
      });

      chai.should();

      requirejs.config({
        deps: ['test_bundle'],
        callback: function () {
          // Report the run to the external test runner (Playwright, S15).
          var runner = mocha.run();
          var failures = [];
          runner.on('fail', function (test, err) {
            failures.push({
              title: test.fullTitle(),
              message: err && err.message,
              stack: err && err.stack
            });
          });
          runner.on('end', function () {
            window.__mochaDone = true;
            window.__mochaStats = runner.stats;
            window.__mochaFailures = failures;
          });
        }
      });
    </script>

  </body>
</html>
